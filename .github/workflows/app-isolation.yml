name: app-isolation
on:
  push:
    branches: ['experiment/app-isolation-loader']
    paths: ['patches/wine-11.0-app-isolation.patch', 'patches/winehq-60721.patch', 'patches/dllmgr-4*.patch', 'patches/dllmgr-5*.patch', 'patches/dllmgr-6*.patch', 'patches/dllmgr-7*.patch', 'tests/wine/app-isolation*', 'patches/dllmgr-27/**', '.github/workflows/app-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine 11 and build dependencies
        timeout-minutes: 6
        run: bash tests/wine/ci-install.sh --winehq --install-recommends winehq-stable git gcc make flex bison gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 libfreetype-dev libfontconfig-dev libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev libxcomposite-dev libxcursor-dev libxfixes-dev libxinerama-dev libsane-dev xvfb
      - name: Build pinned private runtime
        timeout-minutes: 22
        run: bash tests/wine/app-isolation-build.sh
      - name: Verify full executable path isolation
        timeout-minutes: 4
        run: xvfb-run -a bash tests/wine/app-isolation-check.sh
      - name: Package tested runtime and complete modified source
        run: |
          cp tests/wine/app-isolation{.md,-build.sh,-check.sh,.c,-package.py} tests/wine/controls.{rc,manifest} out/isolation/
          cp "$RUNNER_TEMP/wine-source/COPYING.LIB" out/isolation/
          # #27 trampoline + prefill proxy for FastStone (installed next to
          # FSViewer.exe by `dllmgr fix faststone`), with its sources.
          mkdir -p out/isolation/dllmgr-27
          sh patches/dllmgr-27/build.sh msimg32 "$PWD/out/isolation/dllmgr-27/msimg32.dll"
          sh patches/dllmgr-27/build.sh version "$PWD/out/isolation/dllmgr-27/version.dll"
          cp patches/dllmgr-27/{prefill.c,msimg32.def,version.def,version-stubs.c,build.sh,README.md} out/isolation/dllmgr-27/
          python3 tests/wine/app-isolation-package.py
          tar --exclude=.git -C "$RUNNER_TEMP" -c wine-source | xz -T2 > out/wine-11.0-app-isolation-source.tar.xz
          (cd out && sha256sum wine-11.0-app-isolation.zip wine-11.0-app-isolation-source.tar.xz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-isolation
          path: |
            out/
            results/
            ${{ runner.temp }}/wine-build/configure.log
            ${{ runner.temp }}/wine-build/make.log
            ${{ runner.temp }}/dllmgr-ci-install/
