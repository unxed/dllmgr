name: Tahoma Bold correction
on:
  workflow_dispatch:
  push:
    branches: ['codec/faststone-avif*', 'font/*']
    paths: ['experiments/tahoma-bold/freetype/**', 'scripts/tahoma-font.py', '.github/workflows/tahoma-font.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install font build tools
        run: bash tests/wine/ci-install.sh fontforge python3-fonttools python3-freetype ttfautohint
      - name: Fetch the exact original Wine font
        run: |
          mkdir -p wine/fonts
          curl -fSL --connect-timeout 15 --max-time 90 https://raw.githubusercontent.com/wine-mirror/wine/db11d0fe6a169c457e23d007e20404643d067aa8/fonts/tahomabd.ttf -o wine/fonts/tahomabd.ttf
          echo '508a2acc88cd6abdd399ae79c9965db43fba75a46bb115117b55d2be2272d889  wine/fonts/tahomabd.ttf' | sha256sum -c
      - name: Rebuild and verify candidate 009
        run: python3 experiments/tahoma-bold/freetype/build_clean.py wine output --component-safe
      - name: Verify rejected candidates fail the regression check
        run: |
          for candidate in 007 008; do
            set +e
            python3 experiments/tahoma-bold/freetype/validate_counters.py wine/fonts/tahomabd.ttf experiments/tahoma-bold/freetype/tahomabd-revision-$candidate.ttf experiments/tahoma-bold/freetype/affected.json
            result=$?
            set -e
            test "$result" = 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tahoma-bold-reproduction
          path: output/
