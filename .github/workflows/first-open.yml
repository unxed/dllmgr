name: temporary-cs2-session-37
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  session:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      STAND_DISPLAY: ':151'
      STAND_WM: metacity
      WINEARCH: win64
      WINEDEBUG: fixme-all
      WINEDLLOVERRIDES: mscoree,mshtml=
    steps:
      - uses: actions/checkout@v4
      - name: Scope this temporary runner
        run: |
          echo "STAND_DIR=$RUNNER_TEMP/codex-debian-8c42/cs2" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$RUNNER_TEMP/codex-debian-8c42/cs2/prefix" >> "$GITHUB_ENV"
          echo "LAB_OUT=$GITHUB_WORKSPACE/session-evidence" >> "$GITHUB_ENV"
          nproc; free -m; uname -a
          test ! -e /tmp/.X11-unix/X151
      - name: Native Wine 11.0 and headless tools
        run: |
          bash tests/wine/ci-install.sh --winehq --install-recommends \
            winehq-stable=11.0.0.0~noble-1 wine-stable=11.0.0.0~noble-1 \
            wine-stable-amd64=11.0.0.0~noble-1 wine-stable-i386=11.0.0.0~noble-1 \
            xvfb metacity xdotool x11-utils x11-apps imagemagick dbus-x11 unzip gcc-mingw-w64-i686
          /opt/wine-stable/bin/wine --version
      - name: Exact authorized trial source
        run: |
          mkdir -p "$STAND_DIR/dl"
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 300 \
            https://download.adobe.com/pub/adobe/photoshop/win/cs2/Photoshop_CS2.exe \
            -o "$STAND_DIR/dl/Photoshop_CS2.exe"
          echo "919b642d910995089a21c27780eb4e54140ac917549d7d34ceab6157c01d02ea  $STAND_DIR/dl/Photoshop_CS2.exe" | sha256sum -c -
      - name: Install ordinary trial and expose temporary HTTPS command session
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/sandbox-stand.sh session bash .session-lab/session.sh
      - name: Preserve this run's evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-session-37-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            session-evidence/
            ${{ runner.temp }}/dllmgr-ci-install/
            ${{ runner.temp }}/codex-debian-8c42/cs2/xvfb.log
            ${{ runner.temp }}/codex-debian-8c42/cs2/wm.log
