name: Font cache research
on:
  workflow_dispatch:
  push:
    branches: ['research/faststone-font-cache']
    paths: ['experiments/font-cache/**', '.github/workflows/font-cache-research.yml']
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable Wine runtime and build tools
        run: bash tests/wine/ci-install.sh --winehq winehq-stable gcc make flex bison gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 libfreetype-dev libfontconfig-dev xvfb fonts-noto-core fonts-noto-extra
        timeout-minutes: 6
      - name: Build and compare stock and enlarged-cache Unix modules
        run: bash experiments/font-cache/run-ci.sh
        timeout-minutes: 12
      - name: Show the last build diagnostics
        if: failure()
        run: |
          for file in "$RUNNER_TEMP"/font-cache-research/artifact/*.log; do
            echo "$file"
            tail -n 30 "$file"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-cache-research
          path: |
            ${{ runner.temp }}/font-cache-research/artifact/
            ${{ runner.temp }}/dllmgr-ci-install/
