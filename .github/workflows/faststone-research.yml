name: faststone-research
on:
  push:
    branches: ['fix/faststone-suite']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - working-directory: tests/wine
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -o controls.exe faststone-controls.c -lcomctl32 -luxtheme -lgdi32
          x86_64-w64-mingw32-windres controls.rc -O coff -o controls.res
          x86_64-w64-mingw32-gcc -O2 -Wall -o controls6.exe faststone-controls.c controls.res -lcomctl32 -luxtheme -lgdi32
          x86_64-w64-mingw32-gcc -O2 -Wall -o pencil.exe pencil.c -lgdiplus -lgdi32
      - uses: actions/upload-artifact@v4
        with:
          name: controls
          path: tests/wine/*.exe
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: controls
      - shell: bash
        run: |
          ./controls.exe --check-label --check-wheel --check-position | tee windows-v5.txt
          ./controls6.exe --check-label --check-wheel --check-position | tee windows-v6.txt
          ./pencil.exe | tee windows-pencil.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-baseline
          path: windows-*.txt
  wine:
    needs: build
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree,mshtml=
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: controls
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wine wine64 xvfb
      - run: |
          export WINEPREFIX="$RUNNER_TEMP/dllmgr-research-prefix"
          xvfb-run -a bash -e -o pipefail -c 'wineboot -u; wine controls.exe | tee wine-v5.txt; wine controls6.exe | tee wine-v6.txt; wine pencil.exe | tee wine-pencil.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: wine-baseline
          path: wine-*.txt
  faststone75:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine 11.0 and desktop test tools
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo curl -fsSL https://dl.winehq.org/wine-builds/winehq.key -o /etc/apt/keyrings/winehq-archive.key
          sudo curl -fsSL https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources -o /etc/apt/sources.list.d/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-stable xvfb xdotool scrot x11-utils openbox
      - name: Capture the affected FastStone 7.5 controls
        run: xvfb-run -a -s '-screen 0 1920x1080x24' bash -c 'openbox >/dev/null 2>&1 & bash tests/wine/faststone-app.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faststone75
          path: snapshots/
  patched:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unxed/fix-it-in-wine
          ref: 0b37d498ef4fd4b1077421af62974a9b3587e80a
          path: fiw
      - uses: actions/download-artifact@v4
        with:
          name: controls
      - name: Install Wine 11.0 and build packages
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo curl -fsSL https://dl.winehq.org/wine-builds/winehq.key -o /etc/apt/keyrings/winehq-archive.key
          sudo curl -fsSL https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources -o /etc/apt/sources.list.d/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-stable xvfb git gcc make flex bison gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
      - name: Check separate patches, composition and rollback
        run: xvfb-run -a bash tests/wine/check-fixes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-modules
          path: |
            out/
            results/
