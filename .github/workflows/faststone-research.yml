name: faststone-research
on:
  push:
    branches: ['fix/faststone-suite']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - working-directory: tests/wine
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -o controls.exe faststone-controls.c -lcomctl32 -luxtheme -lgdi32
          x86_64-w64-mingw32-windres controls.rc -O coff -o controls.res
          x86_64-w64-mingw32-gcc -O2 -Wall -o controls6.exe faststone-controls.c controls.res -lcomctl32 -luxtheme -lgdi32
      - uses: actions/upload-artifact@v4
        with:
          name: controls
          path: tests/wine/*.exe
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: controls
      - shell: bash
        run: |
          ./controls.exe | tee windows-v5.txt
          ./controls6.exe | tee windows-v6.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-baseline
          path: windows-*.txt
  wine:
    needs: build
    runs-on: ubuntu-24.04
    env:
      WINEPREFIX: /tmp/dllmgr-research-prefix
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree,mshtml=
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: controls
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wine wine64 xvfb
      - run: |
          xvfb-run -a bash -c 'wineboot -u; wine controls.exe | tee wine-v5.txt; wine controls6.exe | tee wine-v6.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: wine-baseline
          path: wine-*.txt
